name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate blueprint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Parse and validate blueprint contracts
        run: pytest -q

      - name: Install Home Assistant validator
        run: python -m pip install homeassistant==2026.2.3

      - name: Validate a real blueprint automation with Home Assistant
        run: |
          mkdir -p /tmp/ha-config/blueprints/automation/zigbee_ota_scheduler
          cp tests/fixtures/configuration.yaml /tmp/ha-config/configuration.yaml
          cp blueprints/automation/zigbee_ota_scheduler/sequential_ota_by_class.yaml \
            /tmp/ha-config/blueprints/automation/zigbee_ota_scheduler/
          hass --script check_config -c /tmp/ha-config
