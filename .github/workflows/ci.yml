name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate blueprint (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2025.8.0"
            colorlog: "6.9.0"
            pycares: "pycares<5"
          - homeassistant: "2026.2.3"
            colorlog: "6.10.1"
            pycares: "pycares"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Parse and validate blueprint contracts
        run: pytest -q

      - name: Install Home Assistant validator
        run: >-
          python -m pip install
          homeassistant==${{ matrix.homeassistant }}
          colorlog==${{ matrix.colorlog }}
          "${{ matrix.pycares }}"

      - name: Validate a real blueprint automation with Home Assistant
        run: |
          set -o pipefail
          mkdir -p /tmp/ha-config/blueprints/automation/zigbee_ota_scheduler
          cp tests/fixtures/configuration.yaml /tmp/ha-config/configuration.yaml
          cp blueprints/automation/zigbee_ota_scheduler/sequential_ota_by_class.yaml \
            /tmp/ha-config/blueprints/automation/zigbee_ota_scheduler/
          hass --script check_config -c /tmp/ha-config 2>&1 | tee /tmp/ha-check.log
          if grep -q "ERROR:" /tmp/ha-check.log; then
            echo "Home Assistant reported configuration errors"
            exit 1
          fi
