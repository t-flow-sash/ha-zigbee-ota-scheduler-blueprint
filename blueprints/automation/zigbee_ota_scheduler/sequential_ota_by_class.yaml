blueprint:
  name: Zigbee-OTA je Geräteklasse – sequenziell im Zeitfenster
  description: >-
    Installiert verfügbare Updates einer frei benannten, logischen Geräteklasse
    täglich in einem Zeitfenster. Die explizit gewählten update-Entitäten werden
    strikt nacheinander verarbeitet. Eine eigene Blueprint-Instanz pro
    Geräteklasse verwenden.
  domain: automation
  source_url: https://github.com/t-flow-sash/ha-zigbee-ota-scheduler-blueprint/blob/main/blueprints/automation/zigbee_ota_scheduler/sequential_ota_by_class.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    device_class_name:
      name: Geräteklasse / Bezeichnung
      description: >-
        Frei wählbare logische Gruppe, zum Beispiel „Zigbee-Lampen“ oder
        „Batteriesensoren“. Sie dient nur der Organisation und führt keine
        automatische Geräteerkennung durch.
      selector:
        text:
    update_entities:
      name: Update-Entitäten
      description: >-
        Geordnete Liste der update-Entitäten dieser Geräteklasse. Die Reihenfolge
        bestimmt die Installationsreihenfolge.
      selector:
        entity:
          multiple: true
          reorder: true
          filter:
            domain: update
    start_time:
      name: Startzeit
      description: Täglicher Start und inklusive Untergrenze des Zeitfensters.
      default: "01:00:00"
      selector:
        time:
    end_time:
      name: Endzeit
      description: >-
        Exklusive Obergrenze. Eine frühere Endzeit als Startzeit bildet ein
        Fenster über Mitternacht ab.
      default: "05:00:00"
      selector:
        time:
    install_timeout:
      name: Abschluss-Timeout
      description: >-
        Maximale Wartezeit auf den Zustand „kein Update verfügbar“, nachdem
        update.install zurückgekehrt ist. Bei Timeout wird der gesamte Lauf
        sicher beendet; es startet kein weiteres Update.
      default:
        hours: 1
      selector:
        duration:
          enable_day: false
    inter_device_delay:
      name: Pause zwischen Geräten
      description: Pause nach einem erfolgreich abgeschlossenen Update.
      default:
        seconds: 30
      selector:
        duration:
          enable_day: false

triggers:
  - trigger: time
    at: !input start_time

conditions: []

actions:
  - alias: Geräte dieser logischen Klasse strikt nacheinander verarbeiten
    repeat:
      for_each: !input update_entities
      sequence:
        - alias: Vor jedem neuen Update das aktuelle Zeitfenster prüfen
          condition: time
          after: !input start_time
          before: !input end_time

        - alias: Nur ein tatsächlich verfügbares Update installieren
          if:
            - condition: template
              value_template: "{{ is_state(repeat.item, 'on') }}"
          then:
            - alias: Update ausschließlich für das aktuelle Gerät starten
              action: update.install
              target:
                entity_id: "{{ repeat.item }}"

            - alias: Auf bestätigten Abschluss warten und bei Unsicherheit stoppen
              wait_template: "{{ is_state(repeat.item, 'off') }}"
              timeout: !input install_timeout
              continue_on_timeout: false

            - alias: Funknetz und Gerät vor dem nächsten Update entlasten
              delay: !input inter_device_delay

mode: single
max_exceeded: silent
