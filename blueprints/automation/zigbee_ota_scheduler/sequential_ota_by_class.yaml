blueprint:
  name: Zigbee-OTA – Live-Discovery nach priorisierter Geräte-Domain
  description: >-
    Erkennt Zigbee-Update-Entitäten bei jedem Lauf live über die Home-Assistant-
    Geräte-Registry. Jedes Gerät gehört zur ersten konfigurierten Domain, die
    unter seinen Geräte-Entitäten vorkommt. Updates laufen global strikt
    nacheinander in klassenbezogenen Zeitfenstern.
  domain: automation
  source_url: https://github.com/t-flow-sash/ha-zigbee-ota-scheduler-blueprint/blob/main/blueprints/automation/zigbee_ota_scheduler/sequential_ota_by_class.yaml
  homeassistant:
    min_version: 2025.8.0
  input:
    device_classes:
      name: Geräteklassen
      description: >-
        Geordnete Domain-Klassen. Die erste konfigurierte Domain, die unter den
        Entitäten eines Zigbee-Geräts vorkommt, gewinnt. Dadurch wird jedes
        Update höchstens einer Klasse zugeordnet.
      selector:
        object:
          multiple: true
          label_field: name
          description_field: domain
          fields:
            name:
              label: Klassenname
              required: true
              selector:
                text:
            domain:
              label: Primär-Domain (priorisierte Zuordnung)
              required: true
              selector:
                select:
                  custom_value: true
                  options:
                    - label: Licht
                      value: light
                    - label: Heizung / Klima
                      value: climate
                    - label: Schalter
                      value: switch
                    - label: Abdeckung / Rollladen
                      value: cover
                    - label: Schloss
                      value: lock
                    - label: Lüfter
                      value: fan
                    - label: Ventil
                      value: valve
                    - label: Staubsauger
                      value: vacuum
                    - label: Mediaplayer
                      value: media_player
                    - label: Sirene
                      value: siren
                    - label: Binärsensor
                      value: binary_sensor
                    - label: Sensor
                      value: sensor
                    - label: Taster
                      value: button
                    - label: Nummer
                      value: number
            update_start:
              label: Updatefenster – Start
              required: true
              selector:
                time:
            update_end:
              label: Updatefenster – Ende
              required: true
              selector:
                time:
            quiet_enabled:
              label: Stummzeitfenster aktivieren
              selector:
                boolean:
            quiet_start:
              label: Stummzeitfenster – Start
              selector:
                time:
            quiet_end:
              label: Stummzeitfenster – Ende
              selector:
                time:
    presence_trackers:
      name: Anwesenheitstracker
      description: >-
        Optional. Wenn Tracker gewählt sind, müssen vor jedem neuen Update alle
        exakt den Zustand home haben. Eine leere Liste deaktiviert dieses Gate.
      default: []
      selector:
        entity:
          multiple: true
          reorder: true
          filter:
            domain: device_tracker
    install_timeout:
      name: Abschluss-Timeout
      description: >-
        Maximale Wartezeit auf den bestätigten Zustand off nach update.install.
        Bei Timeout oder Servicefehler endet der gesamte Lauf sicher, sodass
        kein möglicherweise paralleles OTA gestartet wird.
      default:
        hours: 1
      selector:
        duration:
          enable_day: false

triggers:
  - trigger: time_pattern
    minutes: "/1"
  - trigger: homeassistant
    event: start

conditions: []

variables:
  device_classes: !input device_classes
  presence_trackers: !input presence_trackers

actions:
  - alias: Klassen in konfigurierter Priorität seriell prüfen
    repeat:
      for_each: "{{ device_classes }}"
      sequence:
        - alias: Äußere Klasse und Prioritätsindex vor dem inneren Repeat sichern
          variables:
            current_class: "{{ repeat.item }}"
            current_class_index: "{{ repeat.index }}"

        - alias: Klassenfelder und live erkannte Update-Entitäten bereitstellen
          variables:
            class_name: "{{ current_class['name'] }}"
            class_domain: "{{ current_class['domain'] | string | lower | trim }}"
            class_update_entities: >-
              {% set result = namespace(entities=[]) %}
              {% for update_state in states.update | sort(attribute='entity_id') %}
                {% set update_entity = update_state.entity_id %}
                {% set update_device_id = device_id(update_entity) %}
                {% if update_device_id %}
                  {% set identifiers = device_attr(update_device_id, 'identifiers') %}
                  {% set zigbee = namespace(matched=false) %}
                  {% if identifiers is iterable and identifiers is not string %}
                    {% for identifier in identifiers %}
                      {% if identifier is iterable and identifier is not string and identifier | length >= 1 %}
                        {% set identifier_namespace = identifier[0] | string | lower %}
                        {% set value = identifier[1] | string | lower if identifier | length >= 2 else '' %}
                        {% if identifier_namespace == 'zha' or (identifier_namespace == 'mqtt' and 'zigbee2mqtt' in value) %}
                          {% set zigbee.matched = true %}
                        {% endif %}
                      {% endif %}
                    {% endfor %}
                  {% endif %}
                  {% if zigbee.matched %}
                    {% set sibling_domains = namespace(values=[]) %}
                    {% set siblings = device_entities(update_device_id) %}
                    {% if siblings is iterable and siblings is not string %}
                      {% for sibling in siblings %}
                        {% if sibling is string and '.' in sibling %}
                          {% set sibling_domain = sibling.split('.', 1)[0] | lower %}
                          {% if sibling_domain not in sibling_domains.values %}
                            {% set sibling_domains.values = sibling_domains.values + [sibling_domain] %}
                          {% endif %}
                        {% endif %}
                      {% endfor %}
                    {% endif %}
                    {% set owner = namespace(index=none) %}
                    {% for configured_class in device_classes %}
                      {% set configured_domain = configured_class['domain'] | string | lower | trim %}
                      {% if owner.index is none and configured_domain in sibling_domains.values %}
                        {% set owner.index = loop.index %}
                      {% endif %}
                    {% endfor %}
                    {% if owner.index == (current_class_index | int) and update_entity not in result.entities %}
                      {% set result.entities = result.entities + [update_entity] %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ result.entities }}
            class_update_start: "{{ current_class['update_start'] }}"
            class_update_end: "{{ current_class['update_end'] }}"
            class_quiet_enabled: "{{ current_class.get('quiet_enabled', false) }}"
            class_quiet_start: "{{ current_class.get('quiet_start', '00:00:00') }}"
            class_quiet_end: "{{ current_class.get('quiet_end', '00:00:00') }}"

        - alias: Nicht erlaubte Klasse überspringen, spätere Klassen weiter prüfen
          if:
            - condition: template
              value_template: >-
                {% set current = now().strftime('%H:%M:%S') %}
                {% set start = class_update_start | string %}
                {% set end = class_update_end | string %}
                {% set in_update =
                  (start == end)
                  or (start < end and start <= current < end)
                  or (start > end and (current >= start or current < end)) %}
                {% set quiet_start = class_quiet_start | string %}
                {% set quiet_end = class_quiet_end | string %}
                {% set in_quiet = (class_quiet_enabled | bool) and (
                  (quiet_start == quiet_end)
                  or (quiet_start < quiet_end and quiet_start <= current < quiet_end)
                  or (quiet_start > quiet_end and (current >= quiet_start or current < quiet_end))
                ) %}
                {% set trackers = namespace(all_home=true) %}
                {% for tracker in presence_trackers %}
                  {% if not is_state(tracker, 'home') %}
                    {% set trackers.all_home = false %}
                  {% endif %}
                {% endfor %}
                {{ in_update and not in_quiet and trackers.all_home }}
          then:
            - alias: Live erkannte Entitäten dieser Klasse strikt nacheinander verarbeiten
              repeat:
                for_each: "{{ class_update_entities }}"
                sequence:
                  - alias: Aktuelle Entität vor weiteren Aktionen sichern
                    variables:
                      current_update_entity: "{{ repeat.item }}"

                  - alias: Alle Gates unmittelbar vor jedem neuen OTA erneut prüfen
                    if:
                      - condition: template
                        value_template: >-
                          {% set current = now().strftime('%H:%M:%S') %}
                          {% set start = class_update_start | string %}
                          {% set end = class_update_end | string %}
                          {% set in_update =
                            (start == end)
                            or (start < end and start <= current < end)
                            or (start > end and (current >= start or current < end)) %}
                          {% set quiet_start = class_quiet_start | string %}
                          {% set quiet_end = class_quiet_end | string %}
                          {% set in_quiet = (class_quiet_enabled | bool) and (
                            (quiet_start == quiet_end)
                            or (quiet_start < quiet_end and quiet_start <= current < quiet_end)
                            or (quiet_start > quiet_end and (current >= quiet_start or current < quiet_end))
                          ) %}
                          {% set trackers = namespace(all_home=true) %}
                          {% for tracker in presence_trackers %}
                            {% if not is_state(tracker, 'home') %}
                              {% set trackers.all_home = false %}
                            {% endif %}
                          {% endfor %}
                          {{ in_update and not in_quiet and trackers.all_home
                             and is_state(current_update_entity, 'on') }}
                    then:
                      - alias: Update ausschließlich für die aktuelle Entität starten
                        action: update.install
                        target:
                          entity_id: "{{ current_update_entity }}"

                      - alias: Auf bestätigten Abschluss warten und bei Unsicherheit stoppen
                        wait_template: "{{ is_state(current_update_entity, 'off') }}"
                        timeout: !input install_timeout
                        continue_on_timeout: false

mode: single
max_exceeded: silent
